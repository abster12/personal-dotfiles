# AeroSpace config
# Copy of: /Applications/AeroSpace.app/Contents/Resources/default-config.toml
# Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

after-startup-command = []
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Workspaces 1-9 with app assignments:
#   1 → Cursor         (editor)
#   2 → Ghostty        (terminal)
#   3 → Google Chrome  (browser)
#   4 → IntelliJ IDEA  (IDE)
#   5 → DBeaver        (database)
#   6 → Obsidian       (notes)
#   7 → OpenCode       (AI coding)
#   8 → Brave Browser  (browser)
#   9 → Preview        (PDF viewer)
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

# ──────────────────────────────────────────────
# Auto-assign apps to workspaces by bundle ID
# https://nikitabobko.github.io/AeroSpace/guide#on-window-detected-callback
# ──────────────────────────────────────────────
on-window-detected = [
    # 1 → Cursor
    {
        if = 'test %{app-bundle-id} = com.todesktop.230313mzl4w4u92',
        run = 'move-node-to-workspace 1',
    },
    # 2 → Ghostty
    {
        if = 'test %{app-bundle-id} = com.mitchellh.ghostty',
        run = 'move-node-to-workspace 2',
    },
    # 3 → Google Chrome
    {
        if = 'test %{app-bundle-id} = com.google.Chrome',
        run = 'move-node-to-workspace 3',
    },
    # 4 → IntelliJ IDEA
    {
        if = 'test %{app-bundle-id} = com.jetbrains.intellij',
        run = 'move-node-to-workspace 4',
    },
    # 5 → DBeaver
    {
        if = 'test %{app-bundle-id} = org.jkiss.dbeaver.core.product',
        run = 'move-node-to-workspace 5',
    },
    # 6 → Obsidian
    {
        if = 'test %{app-bundle-id} = md.obsidian',
        run = 'move-node-to-workspace 6',
    },
    # 7 → OpenCode
    {
        if = 'test %{app-bundle-id} = ai.opencode.desktop',
        run = 'move-node-to-workspace 7',
    },
    # 8 → Brave Browser
    {
        if = 'test %{app-bundle-id} = com.brave.Browser',
        run = 'move-node-to-workspace 8',
    },
    # 9 → Preview
    {
        if = 'test %{app-bundle-id} = com.apple.Preview',
        run = 'move-node-to-workspace 9',
    },
]

gaps.inner.horizontal = 4
gaps.inner.vertical =   4
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        8
gaps.outer.right =      8

# ──────────────────────────────────────────────
# Main mode: workspace switching & window ops
# ──────────────────────────────────────────────
[mode.main.binding]

    # ── Layout ──
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # ── Focus ──
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # ── Move window ──
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # ── Resize ──
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # ── Switch workspace (alt-<num>) ──
    # 1 = Cursor, 2 = Ghostty, 3 = Chrome, 4 = IntelliJ, 5 = DBeaver
    # 6 = Obsidian, 7 = OpenCode, 8 = Brave, 9 = Preview
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # ── Move window to workspace (alt-shift-<num>) ──
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    # ── Launch apps on their workspace (alt-cmd-<num>) ──
    # Switch to the target workspace FIRST, then open the app there so its
    # window lands on the correct workspace.
    alt-cmd-1 = '''exec-and-forget aerospace workspace 1 && open -a "Cursor"'''
    alt-cmd-2 = '''exec-and-forget aerospace workspace 2 && open -a "Ghostty"'''
    alt-cmd-3 = '''exec-and-forget aerospace workspace 3 && open -a "Google Chrome"'''
    alt-cmd-4 = '''exec-and-forget aerospace workspace 4 && open -a "IntelliJ IDEA"'''
    alt-cmd-5 = '''exec-and-forget aerospace workspace 5 && open -a "DBeaver"'''
    alt-cmd-6 = '''exec-and-forget aerospace workspace 6 && open -a "Obsidian"'''
    alt-cmd-7 = '''exec-and-forget aerospace workspace 7 && open -a "OpenCode"'''
    alt-cmd-8 = '''exec-and-forget aerospace workspace 8 && open -a "Brave Browser"'''
    alt-cmd-9 = '''exec-and-forget aerospace workspace 9 && open -a "Preview"'''

    # ── Misc ──
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-shift-semicolon = 'mode service'

# ──────────────────────────────────────────────
# Service mode: maintenance actions
# ──────────────────────────────────────────────
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']          # reset layout
    f = ['layout floating tiling', 'mode main']          # toggle float/tile
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
